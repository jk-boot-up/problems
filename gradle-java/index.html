*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:14px 20px}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--mut);font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
input{flex:1;min-width:220px}
.themes{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.themes button{background:var(--panel);color:var(--mut);border:0;padding:7px 11px;cursor:pointer}
.themes button.on{background:var(--accent);color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
table{width:100%;border-collapse:collapse;margin:16px 0 40px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}
th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em;background:var(--panel2);cursor:pointer;user-select:none}
tr:hover td{background:var(--panel2)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.d{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.Easy{background:var(--okbg);color:var(--ok)}.Medium{background:var(--curbg);color:var(--cur)}.Hard{background:var(--badbg);color:var(--bad)}
.v{display:inline-block;margin:0 6px 4px 0;font-size:13px;white-space:nowrap}
.v small{color:var(--mut)}
.num{color:var(--mut);font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--mut)}
</style>
</head>

</div></header>

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const order = { Easy: 0, Medium: 1, Hard: 2 };
let sortKey = 'i', sortDir = 1;
[...new Set(DATA.map(p => p.topic))].sort().forEach(t => $('topic').insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
function render() {
  const q = $('q').value.trim().toLowerCase(), d = $('diff').value, t = $('topic').value;
  const rows = DATA.filter(p => (!d || p.diff === d) && (!t || p.topic === t) &&
    (!q || `${p.num} ${p.title} ${p.topic} ${p.versions.map(v => v.name).join(' ')}`.toLowerCase().includes(q)));
  rows.sort((a, b) => { const x = sortKey === 'diff' ? order[a.diff] - order[b.diff] : a[sortKey] < b[sortKey] ? -1 : a[sortKey] > b[sortKey] ? 1 : 0; return x * sortDir; });
  $('rows').innerHTML = rows.map(p => `<tr><td class="num">${p.i}</td><td class="num">${p.num}</td><td><a href="${p.dir}/README.md">${esc(p.title)}</a></td><td><span class="d ${p.diff}">${p.diff}</span></td><td>${esc(p.topic)}</td><td>${p.versions.map(v => `<span class="v"><a href="${p.dir}/${v.dir}/README.md">${v.v}</a> <small>${esc(v.name)} · ${esc(v.time)}</small> <a href="${p.dir}/${v.dir}/animation/index.html" title="Open the animation">▶</a></span>`).join('<br>')}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No problems match.</td></tr>';
  const by = k => DATA.filter(p => p.diff === k).length;
  $('stats').innerHTML = `<span class="chip">${rows.length} of ${DATA.length} problems</span><span class="chip">${DATA.reduce((s, p) => s + p.versions.length, 0)} projects</span><span class="chip">Easy ${by('Easy')}</span><span class="chip">Medium ${by('Medium')}</span><span class="chip">Hard ${by('Hard')}</span>`;
}
document.querySelectorAll('th[data-k]').forEach(th => (th.onclick = () => { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); }));
['q', 'diff', 'topic'].forEach(id => ($(id).oninput = render));
function setTheme(t) { document.documentElement.dataset.theme = t; try { localStorage.setItem('algo-theme', t); } catch (e) { } document.querySelectorAll('.themes button').forEach(b => b.classList.toggle('on', b.dataset.theme === t)); }
document.querySelectorAll('.themes button').forEach(b => (b.onclick = () => setTheme(b.dataset.theme)));
let saved = 'dark'; try { saved = localStorage.getItem('algo-theme') || saved; } catch (e) { }
setTheme(saved);
render();
</script>
